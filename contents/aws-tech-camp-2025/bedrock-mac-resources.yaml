AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Template for 2025 Q3 TechCamp'

# Parameters:
#   AllowedRegion:
#     Type: String
#     Default: us-west-2

# Conditions:
#   IsCorrectRegion: !Equals [!Ref "AWS::Region", !Ref AllowedRegion]

Resources:
  # [선행 조건] 워크샵 참여자가 "bedrock-mac-cloudformation-${AWS::AccountId}" 라는 S3 Bucket 생성 후, 해당 .yaml 파일과 python.zip(람다 레이어)을 S3 Bucket에 업로드
  LambdaLayerForAll:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: common-lambda-layer
      Description: A shared Lambda layer containing multiple Python libraries used by functions for Amazon Bedrock Multi-Agent Collaboration.
      Content:
        S3Bucket: !Sub "cloudformation-staging-bucket-${AWS::AccountId}"
        S3Key: python.zip
      CompatibleRuntimes:
        - python3.10
        - python3.11
      CompatibleArchitectures:
        - x86_64
      LicenseInfo: MIT 


  # 모든 Lambda function이 공통적으로 사용하는 execution Role
  LambdaRoleActions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bedrock-multi-agent-lambda-role
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:  
        - Effect: Allow
          Principal:  
            Service: 
             - lambda.amazonaws.com
          Action: 
           - sts:AssumeRole

  # Lambda function - agent_web_search
  LambdaFunctionAgentWebSearch:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.10
      Handler: index.lambda_handler
      Architectures:
        - x86_64
      FunctionName: agent_web_search
      Role: !GetAtt LambdaRoleActions.Arn
      Timeout: 600
      MemorySize: 512
      EphemeralStorage:
        Size: 512
      Code:
        ZipFile: |
          import http.client
          import json
          import logging
          import os
          import urllib.parse
          import urllib.request
          import boto3

          session = boto3.session.Session()
          secrets_manager = session.client(service_name="secretsmanager")
          SECRET_KEY_NAME = "TAVILY_API_KEY"
          FUNCTION_NAMES = []

          log_level = "INFO"
          logging.basicConfig(
              format="[%(asctime)s] p%(process)s {%(filename)s:%(lineno)d} %(levelname)s - %(message)s"
          )
          logger = logging.getLogger(__name__)
          logger.setLevel(log_level)

          def get_from_secretstore(SecretId: str) -> str:
              try:
                  secret_value = secrets_manager.get_secret_value(SecretId=SecretId)
              except Exception as e:
                  logger.error(f"could not get secret {SecretId} from secrets manager: {e}")
                  raise e
              SecretString: str = secret_value["SecretString"]
              try:
                  secret_json = json.loads(SecretString) # JSON 형태로 들어오는 경우 파싱하여 TAVILY_API_KEY 값만 추출
                  if isinstance(secret_json, dict) and "TAVILY_API_KEY" in secret_json:
                      return secret_json["TAVILY_API_KEY"]
              except json.JSONDecodeError:
                  pass # JSON이 아닌 경우 원래 값 사용
              return SecretString

          try:
              TAVILY_API_KEY = get_from_secretstore(SecretId=SECRET_KEY_NAME)
              FUNCTION_NAMES.append("web_search")
              FUNCTION_NAMES.append("multi_search")  # 새로운 함수 추가
          except Exception as e:
              TAVILY_API_KEY = None

          def web_search(
              search_query: str, target_website: str = "", topic: str = None, days: int = None, include_images: bool = True
          ) -> str:
              logger.info(f"executing Tavily AI search with {search_query=}")
              base_url = "https://api.tavily.com/search"
              headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": f"Bearer {TAVILY_API_KEY}"
              }
              payload = {
                  "query": search_query,
                  "search_depth": "advanced",
                  "include_images": True,  # 이미지 포함 옵션 변경
                  "include_answer": False,
                  "include_raw_content": False,
                  "max_results": 3
              }
              # 선택적 매개변수
              if topic is not None:
                  payload["topic"] = topic
              if days is not None:
                  payload["days"] = days
              if target_website:
                  payload["include_domains"] = [target_website]

              data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(base_url, data=data, headers=headers)

              try:
                  response = urllib.request.urlopen(request)
                  response_data: str = response.read().decode("utf-8")
                  logger.debug(f"response from Tavily AI search {response_data=}")
                  return response_data
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8")
                  error_message = f"failed to retrieve search results from Tavily AI Search, error: {e.code}"
                  logger.error(f"{error_message}, details: {error_body}")
                  return json.dumps({"error": error_message, "details": error_body}, ensure_ascii=False)
              return ""

          # 여러 쿼리를 처리하는 새로운 함수 추가
          def multi_search(
              search_queries: list, target_website: str = "", topic: str = None, days: int = None
          ) -> str:
              logger.info(f"executing multiple Tavily AI searches with {search_queries=}")

              all_results = []

              for query in search_queries:
                  # 각 쿼리에 대해 web_search 함수 호출
                  search_result = web_search(query, target_website, topic, days, include_images=True)

                  try:
                      # 결과를 JSON으로 파싱
                      result_json = json.loads(search_result)

                      # 쿼리 정보 추가
                      result_json["query"] = query

                      all_results.append(result_json)
                  except json.JSONDecodeError:
                      logger.error(f"Failed to parse search result for query: {query}")
                      all_results.append({
                          "query": query,
                          "error": "Failed to parse search result",
                          "raw_result": search_result
                      })

              # 모든 결과를 하나의 JSON으로 통합
              combined_results = {
                  "multi_search_results": all_results
              }

              return json.dumps(combined_results, ensure_ascii=False)

          def lambda_handler(event, context):
              logging.debug(f"{event=}")
              agent = event["agent"]
              actionGroup = event["actionGroup"]
              function = event["function"]
              parameters = event.get("parameters", [])
              responseBody = {"TEXT": {"body": "Error, no function was called"}}
              logger.info(f"{actionGroup=}, {function=}")

              if function in FUNCTION_NAMES:
                  if function == "web_search":
                      search_query = None
                      target_website = None
                      topic = None
                      days = None

                      for param in parameters:
                          if param["name"] == "search_query":
                              search_query = param["value"]
                          if param["name"] == "target_website":
                              target_website = param["value"]
                          if param["name"] == "topic":
                              topic = param["value"]
                          if param["name"] == "days":
                              days = param["value"]
                      if not search_query:
                          responseBody = {
                              "TEXT": {"body": "Missing mandatory parameter: search_query"}
                          }
                      else:
                          search_results = web_search(search_query, target_website, topic, days)
                          responseBody = {
                              "TEXT": {
                                  "body": f"Here are the top search results for the query '{search_query}': {search_results} "
                              }
                          }
                          logger.debug(f"query results {search_results=}")

                  elif function == "multi_search":
                      search_queries = None
                      target_website = None
                      topic = None
                      days = None
                      for param in parameters:
                          if param["name"] == "search_queries":
                              # 문자열로 전달된 경우 처리
                              if isinstance(param["value"], str):
                                  try:
                                      # 문자열을 리스트로 변환 시도
                                      import ast
                                      search_queries = ast.literal_eval(param["value"])
                                  except:
                                      # 쉼표로 구분된 문자열로 가정하고 분할
                                      search_queries = [q.strip() for q in param["value"].strip('[]').split(',')]
                              else:
                                  search_queries = param["value"]
                          if param["name"] == "target_website":
                              target_website = param["value"]
                          if param["name"] == "topic":
                              topic = param["value"]
                          if param["name"] == "days":
                              days = param["value"]

                      if not search_queries or not isinstance(search_queries, list):
                          responseBody = {
                              "TEXT": {"body": "Missing or invalid mandatory parameter: search_queries (must be a list)"}
                          }
                      else:
                          search_results = multi_search(search_queries, target_website, topic, days)
                          responseBody = {
                              "TEXT": {
                                  "body": f"Here are the results for multiple search queries: {search_results} "
                              }
                          }
                          logger.debug(f"multi query results {search_results=}")
              else:
                  responseBody = {"TEXT": {"body": f"Unable to get {SECRET_KEY_NAME} Secret Key"}}

              action_response = {
                  "actionGroup": actionGroup,
                  "function": function,
                  "functionResponse": {"responseBody": responseBody}
              }
              function_response = {
                  "response": action_response,
                  "messageVersion": event["messageVersion"],
              }
              logger.debug(f"lambda_handler: {function_response=}")

              return function_response
    
  LambdaAgentWebSearchPermissionForBedrockAgentAlias:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaFunctionAgentWebSearch.Arn
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*

  LambdaAgentWebSearchPermissionForBedrockAgent:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt LambdaFunctionAgentWebSearch.Arn
      Principal: bedrock.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
  
  # Lambda function - put_s3_data
  LambdaFunctionPutS3Data:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.lambda_handler
      Architectures:
        - x86_64
      Layers: 
        - !Ref LambdaLayerForAll
      FunctionName: put_s3_data
      Role: !GetAtt LambdaRoleActions.Arn
      Timeout: 600
      MemorySize: 512
      EphemeralStorage:
        Size: 512
      Code:
        ZipFile: |
          import json
          import boto3
          import base64
          import os
          import re
          import traceback
          import datetime
          import uuid
          import requests
          from io import BytesIO
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
              """
              Lambda 함수: S3 관련 작업을 처리하는 핸들러
              
              Parameters:
              - event: Lambda 이벤트 객체
              - context: Lambda 컨텍스트 객체
              
              Returns:
              - S3 작업 결과를 포함하는 JSON 응답
              """
              print("lambda_handler 함수 시작")
              print(f"이벤트: {json.dumps(event)}")
              
              try:
                  action_group = event.get('actionGroup', '')
                  message_version = event.get('messageVersion', '')
                  function = event.get('function', '')
                  
                  print(f"액션 그룹: {action_group}, 메시지 버전: {message_version}, 함수: {function}")
                  
                  # 함수 매핑
                  function_mapping = {
                      'write_analysis_to_s3': write_analysis_to_s3_handler,
                      'read_analysis_from_s3': read_analysis_from_s3_handler,
                      'list_analysis_files': list_analysis_files_handler,
                      'delete_analysis_file': delete_analysis_file_handler,
                      'process_tavily_images': process_tavily_images_handler
                  }
                  
                  if function in function_mapping:
                      # 해당 함수 핸들러 호출
                      output = function_mapping[function](event)
                  else:
                      print(f"지원되지 않는 함수: {function}")
                      output = {
                          'error': f"지원되지 않는 함수: {function}"
                      }
                  
                  # Bedrock Agent 응답 형식으로 변환
                  action_response = {
                      'actionGroup': action_group,
                      'function': function,
                      'functionResponse': {
                          'responseBody': {'TEXT': {'body': json.dumps(output, ensure_ascii=False)}}
                      }
                  }
                  
                  function_response = {'response': action_response, 'messageVersion': message_version}
                  print(f"응답 생성 완료: {json.dumps(function_response, ensure_ascii=False)[:200]}...")
                  return function_response
              
              except Exception as e:
                  print(f"lambda_handler 함수 처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  
                  # 오류 발생 시에도 Bedrock Agent 응답 형식으로 반환
                  error_response = {
                      'response': {
                          'actionGroup': event.get('actionGroup', ''),
                          'function': event.get('function', ''),
                          'functionResponse': {
                              'responseBody': {'TEXT': {'body': json.dumps({'error': f"처리 중 오류가 발생했습니다: {str(e)}"}, ensure_ascii=False)}}
                          }
                      },
                      'messageVersion': event.get('messageVersion', '')
                  }
                  return error_response

          def get_named_parameter(event, name):
              """
              이벤트에서 특정 이름의 파라미터 값을 추출합니다.
              
              Parameters:
              - event: Lambda 이벤트 객체
              - name: 파라미터 이름
              
              Returns:
              - 파라미터 값 또는 None (파라미터가 없는 경우)
              """
              print(f"파라미터 추출 시도: {name}, 이벤트 파라미터: {event.get('parameters', [])}")
              for param in event.get('parameters', []):
                  if param['name'] == name:
                      print(f"파라미터 {name} 값: {param['value']}")
                      return param['value']
              print(f"파라미터 {name}을(를) 찾을 수 없음")
              return None

          def write_analysis_to_s3_handler(event):
              """
              write_analysis_to_s3 함수의 핸들러
              
              Parameters:
              - event: Lambda 이벤트 객체
              
              Returns:
              - S3 저장 결과를 포함하는 응답
              """
              # 파라미터 추출
              s3_uri = get_named_parameter(event, "s3_uri")
              agent_name = get_named_parameter(event, "agent_name")
              description = get_named_parameter(event, "description")
              references_json = get_named_parameter(event, "references_json") or "[]"
              artifacts_json = get_named_parameter(event, "artifacts_json") or "[]"
              
              # 함수 호출
              return write_analysis_to_s3(
                  s3_uri, 
                  agent_name, 
                  description,
                  references_json,
                  artifacts_json
              )

          def write_analysis_to_s3(s3_uri, agent_name, description, references_json="[]", artifacts_json="[]"):
              """
              분석 결과를 S3에 저장하는 함수 (파라미터 간소화)
              
              Parameters:
              - s3_uri: S3 URI (형식: s3://bucket-name/prefix)
              - agent_name: 에이전트 이름
              - description: 분석 결과 설명 (첫 줄은 분석 단계 제목으로 사용됨)
              - references_json: 참조 출처 목록 (JSON 문자열 형식)
              - artifacts_json: 생성된 파일 목록 (JSON 문자열 형식)
              
              Returns:
              - 저장 결과를 포함하는 응답
              """
              try:
                  if not s3_uri:
                      return {'error': 'S3 URI가 제공되지 않았습니다.'}
                  
                  if not agent_name:
                      return {'error': '에이전트 이름이 제공되지 않았습니다.'}
                  
                  if not description:
                      return {'error': '분석 결과 설명이 제공되지 않았습니다.'}
                  
                  # S3 URI 파싱
                  if s3_uri.startswith('s3://'):
                      s3_uri = s3_uri[5:]  # 's3://' 제거
                  
                  parts = s3_uri.split('/', 1)
                  bucket_name = parts[0]
                  prefix = parts[1] if len(parts) > 1 else ''
                  
                  # S3 클라이언트 생성
                  s3_client = boto3.client('s3')
                  
                  # 현재 시간
                  current_time = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  
                  # 고유 파일 이름 생성
                  file_id = str(uuid.uuid4())[:8]
                  file_name = f"{agent_name}_{file_id}.txt"
                  
                  # 아티팩트 파싱
                  try:
                      artifacts = json.loads(artifacts_json)
                  except:
                      artifacts = []
                      
                  # 참조 출처 파싱
                  try:
                      references = json.loads(references_json)
                  except:
                      references = []
                  
                  # description에서 첫 줄을 분석 단계 제목으로 사용
                  description_lines = description.strip().split('\n', 1)
                  stage = description_lines[0].strip()
                  detailed_description = description_lines[1].strip() if len(description_lines) > 1 else description
                  
                  # 분석 결과 형식 생성
                  content = "==================================================\n"
                  content += f"## Analysis Stage: {stage}\n"
                  content += f"## Execution Time: {current_time}\n"
                  content += "--------------------------------------------------\n"
                  content += "Result Description: \n\n"
                  content += f"{detailed_description}\n\n"
                  
                  # 참조 출처 추가
                  if references and len(references) > 0:
                      content += "--------------------------------------------------\n"
                      content += "References:\n"
                      for i, ref in enumerate(references):
                          title = ref.get('title', 'No title')
                          url = ref.get('url', '')
                          query = ref.get('query', '')
                          content += f"{i+1}. [{title}]({url}) - Query: {query}\n"
                  
                  # 아티팩트 추가
                  if artifacts and len(artifacts) > 0:
                      content += "--------------------------------------------------\n"
                      content += "Generated Files:\n"
                      for artifact in artifacts:
                          content += f"- {artifact['path']} : {artifact['description']}\n"
                  
                  content += "==================================================\n"
                  
                  # S3 키 생성
                  s3_key = f"{prefix.rstrip('/')}/{file_name}" if prefix else file_name
                  
                  # S3에 파일 업로드
                  s3_client.put_object(
                      Bucket=bucket_name,
                      Key=s3_key,
                      Body=content.encode('utf-8'),
                      ContentType='text/plain'
                  )
                  
                  return {
                      'message': '분석 결과가 성공적으로 저장되었습니다.',
                      'file_name': file_name,
                      's3_path': f"s3://{bucket_name}/{s3_key}"
                  }
                  
              except Exception as e:
                  print(f"처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"처리 중 오류가 발생했습니다: {str(e)}"
                  }

          def read_analysis_from_s3_handler(event):
              """
              read_analysis_from_s3 함수의 핸들러
              
              Parameters:
              - event: Lambda 이벤트 객체
              
              Returns:
              - S3 읽기 결과를 포함하는 응답
              """
              # 파라미터 추출
              s3_uri = get_named_parameter(event, "s3_uri")
              file_name = get_named_parameter(event, "file_name")
              agent_name = get_named_parameter(event, "agent_name")
              
              # S3 URI 파싱
              if s3_uri.startswith('s3://'):
                  s3_uri = s3_uri[5:]  # 's3://' 제거
              
              parts = s3_uri.split('/', 1)
              bucket_name = parts[0]
              prefix = parts[1] if len(parts) > 1 else ''
              
              # 함수 호출
              if file_name:
                  return read_specific_file(bucket_name, prefix, file_name)
              elif agent_name:
                  return read_agent_files(bucket_name, prefix, agent_name)
              else:
                  return read_all_files(bucket_name, prefix)

          def read_specific_file(bucket_name, prefix, file_name):
              """
              특정 파일을 S3에서 읽어오는 함수
              
              Parameters:
              - bucket_name: S3 버킷 이름
              - prefix: S3 객체 접두사 (폴더 경로)
              - file_name: 파일 이름
              
              Returns:
              - 파일 내용을 포함하는 응답
              """
              try:
                  if not bucket_name:
                      return {'error': '버킷 이름이 제공되지 않았습니다.'}
                  
                  if not file_name:
                      return {'error': '파일 이름이 제공되지 않았습니다.'}
                  
                  # S3 클라이언트 생성
                  s3_client = boto3.client('s3')
                  
                  # S3 키 생성
                  s3_key = f"{prefix.rstrip('/')}/{file_name}" if prefix else file_name
                  
                  # S3에서 파일 읽기
                  response = s3_client.get_object(Bucket=bucket_name, Key=s3_key)
                  content = response['Body'].read().decode('utf-8')
                  
                  # 분석 결과 파싱
                  analyses = parse_results_file(content)
                  
                  return {
                      'file_name': file_name,
                      'analyses': analyses,
                      'message': '파일을 성공적으로 로드했습니다.'
                  }
                  
              except ClientError as e:
                  print(f"S3 파일 로드 오류: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"파일을 찾을 수 없습니다: {str(e)}"
                  }
              except Exception as e:
                  print(f"처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"처리 중 오류가 발생했습니다: {str(e)}"
                  }

          def read_agent_files(bucket_name, prefix, agent_name):
              """
              특정 에이전트의 모든 파일을 S3에서 읽어오는 함수
              
              Parameters:
              - bucket_name: S3 버킷 이름
              - prefix: S3 객체 접두사 (폴더 경로)
              - agent_name: 에이전트 이름
              
              Returns:
              - 파일 내용을 포함하는 응답
              """
