          def list_analysis_files(bucket_name, prefix, agent_name=None):
              """
              S3에 저장된 분석 파일 목록을 가져오는 함수
              
              Parameters:
              - bucket_name: S3 버킷 이름
              - prefix: S3 객체 접두사 (폴더 경로)
              - agent_name: 에이전트 이름 (선택 사항)
              
              Returns:
              - 파일 목록을 포함하는 응답
              """
              try:
                  if not bucket_name:
                      return {'error': '버킷 이름이 제공되지 않았습니다.'}
                  
                  # S3 클라이언트 생성
                  s3_client = boto3.client('s3')
                  
                  # S3 접두사 생성
                  s3_prefix = prefix.rstrip('/') + '/' if prefix else ''
                  if agent_name:
                      s3_prefix = f"{s3_prefix}{agent_name}_"
                  
                  # S3에서 파일 목록 가져오기
                  response = s3_client.list_objects_v2(
                      Bucket=bucket_name,
                      Prefix=s3_prefix
                  )
                  
                  if 'Contents' not in response:
                      return {
                          'message': "파일을 찾을 수 없습니다.",
                          'files': []
                      }
                  
                  files = []
                  
                  for obj in response['Contents']:
                      if not obj['Key'].endswith('.txt'):
                          continue
                          
                      file_name = obj['Key'].split('/')[-1]
                      last_modified = obj['LastModified'].strftime("%Y-%m-%d %H:%M:%S")
                      size = obj['Size']
                      
                      files.append({
                          'file_name': file_name,
                          'last_modified': last_modified,
                          'size': size,
                          's3_path': f"s3://{bucket_name}/{obj['Key']}"
                      })
                  
                  return {
                      'files': files,
                      'count': len(files),
                      'message': "파일 목록을 성공적으로 가져왔습니다."
                  }
                  
              except Exception as e:
                  print(f"처리 중 오류 발생: {str(e)}")
