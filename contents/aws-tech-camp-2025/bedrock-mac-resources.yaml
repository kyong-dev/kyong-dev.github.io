              Parameters:
              - event: Lambda 이벤트 객체
              
              Returns:
              - 이미지 처리 결과를 포함하는 응답
              """
              # 파라미터 추출
              s3_uri = get_named_parameter(event, "s3_uri")
              agent_name = get_named_parameter(event, "agent_name")
              tavily_response = get_named_parameter(event, "tavily_response")
              
              # 함수 호출
              return process_tavily_images(s3_uri, agent_name, tavily_response)

          def process_tavily_images(s3_uri, agent_name, tavily_response):
              """
              Tavily API 응답에서 이미지 URL을 추출하여 S3에 저장하는 함수
              
              Parameters:
              - s3_uri: S3 URI (형식: s3://bucket-name/prefix)
              - agent_name: 에이전트 이름
              - tavily_response: Tavily API 응답 (JSON 문자열)
              
              Returns:
              - 이미지 처리 결과와 출처 URL을 포함하는 응답
              """
              try:
                  if not s3_uri:
                      return {'error': 'S3 URI가 제공되지 않았습니다.'}
                  
                  if not agent_name:
                      return {'error': '에이전트 이름이 제공되지 않았습니다.'}
                  
                  if not tavily_response:
                      return {'error': 'Tavily API 응답이 제공되지 않았습니다.'}
                  
                  # S3 URI 파싱
                  if s3_uri.startswith('s3://'):
                      s3_uri = s3_uri[5:]  # 's3://' 제거
                  
                  parts = s3_uri.split('/', 1)
                  bucket_name = parts[0]
                  prefix = parts[1] if len(parts) > 1 else ''
                  
                  # tavily_response가 문자열인 경우 JSON으로 파싱
                  if isinstance(tavily_response, str):
                      try:
                          tavily_data = json.loads(tavily_response)
                      except json.JSONDecodeError:
                          return {'error': 'Tavily API 응답을 JSON으로 파싱할 수 없습니다.'}
                  else:
                      tavily_data = tavily_response
                  
                  # 이미지 URL 추출
                  image_urls = []
                  
                  # 출처 URL 추출
                  source_urls = []
                  
                  # multi_search_results 형식 처리
                  if 'multi_search_results' in tavily_data:
                      for result in tavily_data['multi_search_results']:
                          # 이미지 추출
                          if 'images' in result and isinstance(result['images'], list):
                              image_urls.extend(result['images'])
                          
                          # 출처 URL 추출
                          if 'results' in result and isinstance(result['results'], list):
                              for item in result['results']:
                                  if 'url' in item:
                                      source_urls.append({
                                          'url': item['url'],
                                          'title': item.get('title', ''),
                                          'query': result.get('query', '')
                                      })
                  
                  # 단일 검색 결과 형식 처리
                  else:
                      # 이미지 추출
                      if 'images' in tavily_data and isinstance(tavily_data['images'], list):
                          image_urls.extend(tavily_data['images'])
                      
                      # 출처 URL 추출
                      if 'results' in tavily_data and isinstance(tavily_data['results'], list):
                          for item in tavily_data['results']:
                              if 'url' in item:
                                  source_urls.append({
                                      'url': item['url'],
                                      'title': item.get('title', ''),
                                      'query': tavily_data.get('query', '')
                                  })
                  
                  # 이미지 다운로드 및 S3 업로드
                  processed_images = []
                  
                  for image_url in image_urls:
                      result = download_and_upload_image_to_s3(image_url, bucket_name, prefix, agent_name)
                      processed_images.append(result)
                  
                  return {
                      'message': f'{len(processed_images)}개의 이미지를 성공적으로 처리했습니다.',
                      'images': processed_images,
                      'sources': source_urls
                  }
                  
              except Exception as e:
                  print(f"처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"처리 중 오류가 발생했습니다: {str(e)}"
                  }

