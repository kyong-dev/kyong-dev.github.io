                      analyses = load_image_files(s3_client, bucket_name, img_files, analyses)
                      print("이미지 파일 로드 완료")
                  
                  print(f"get_s3_data 함수 완료: {len(analyses)}개의 분석 결과 추출")
                  return {
                      'analyses': analyses,
                      'message': '데이터를 성공적으로 로드했습니다.'
                  }
                  
              except Exception as e:
                  print(f"처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"처리 중 오류가 발생했습니다: {str(e)}"
                  }

          def parse_results_file(content):
              """
              결과 파일 내용을 파싱하여 분석 결과 목록을 반환합니다.
              
              Parameters:
              - content: 결과 파일의 내용 (문자열)
              
              Returns:
              - 분석 결과 목록 (딕셔너리 리스트)
              """
              print("parse_results_file 함수 시작")
              analyses = []
              
              # 분석 결과 블록 분리
              # 각 분석 결과는 ================================================== 로 구분됨
              analysis_blocks = content.split("==================================================")
              print(f"분석 블록 수: {len(analysis_blocks)}")
              
              for i, block in enumerate(analysis_blocks):
                  if not block.strip():
                      print(f"블록 {i+1}: 빈 블록, 건너뜀")
                      continue
                  
                  print(f"블록 {i+1} 처리 중 (길이: {len(block)})")
                  
                  # 분석 이름 추출
                  analysis_name_match = re.search(r'## Analysis Stage: (.*?)$', block, re.MULTILINE)
                  analysis_name = analysis_name_match.group(1) if analysis_name_match else "분석 이름 없음"
                  print(f"블록 {i+1} 분석 이름: {analysis_name}")
                  
                  # 실행 시간 추출
                  time_match = re.search(r'## Execution Time: (.*?)$', block, re.MULTILINE)
                  execution_time = time_match.group(1) if time_match else "시간 정보 없음"
                  print(f"블록 {i+1} 실행 시간: {execution_time}")
                  
                  # 결과 설명 추출
                  results_section = block.split("Result Description:", 1)
                  results_text = ""
                  if len(results_section) > 1:
                      split_sections = results_section[1].split("--------------------------------------------------", 1)
                      results_text = split_sections[0].strip()
                      print(f"블록 {i+1} 결과 설명 길이: {len(results_text)}")
                  else:
                      print(f"블록 {i+1} '결과 설명:' 섹션을 찾을 수 없음")
                  
                  # 참조 출처 추출
                  references = []
                  references_section = block.split("References:", 1)
                  if len(references_section) > 1:
                      references_text = references_section[1].split("--------------------------------------------------", 1)[0].strip()
                      print(f"블록 {i+1} 참조 출처 섹션 길이: {len(references_text)}")
                      reference_lines = re.findall(r'(\d+)\. \[(.*?)\]\((.*?)\)(.*?)$', references_text, re.MULTILINE)
                      print(f"블록 {i+1} 찾은 참조 출처 라인 수: {len(reference_lines)}")
                      for num, title, url, query in reference_lines:
                          query_text = query.strip()
                          if query_text.startswith("- Query:"):
                              query_text = query_text[8:].strip()
                          references.append({
                              "title": title,
                              "url": url,
                              "query": query_text
                          })
                  
                  # 아티팩트 추출
                  artifacts = []
                  artifacts_section = block.split("Generated Files:", 1)
                  if len(artifacts_section) > 1:
                      artifacts_text = artifacts_section[1]
                      print(f"블록 {i+1} 아티팩트 섹션 길이: {len(artifacts_text)}")
                      artifact_lines = re.findall(r'- (.*?) : (.*?)$', artifacts_text, re.MULTILINE)
                      print(f"블록 {i+1} 찾은 아티팩트 라인 수: {len(artifact_lines)}")
                      artifacts = [{"path": path, "description": desc} for path, desc in artifact_lines]
                      for j, (path, desc) in enumerate(artifact_lines):
                          print(f"블록 {i+1} 아티팩트 {j+1}: 경로={path}, 설명={desc}")
                  else:
                      print(f"블록 {i+1} '생성된 파일:' 섹션을 찾을 수 없음")
                      
                  analyses.append({
                      "name": analysis_name,
                      "time": execution_time,
                      "results": results_text,
                      "references": references,
                      "artifacts": artifacts
                  })
              
              print(f"parse_results_file 함수 완료, 분석 결과 수: {len(analyses)}")
              return analyses

          def load_image_files(s3_client, bucket_name, img_files, analyses):
              """
              이미지 파일 정보를 S3에서 가져와 경로 정보만 추가합니다.
              Base64 인코딩은 수행하지 않고 S3 경로만 제공합니다.
              
              Parameters:
              - s3_client: boto3 S3 클라이언트
              - bucket_name: S3 버킷 이름
              - img_files: 이미지 파일 키 목록
              - analyses: 분석 결과 목록 (수정됨)
              
              Returns:
              - 수정된 분석 결과 목록
              """
              print("load_image_files 함수 시작 - 이미지 경로만 추가")
              
              # 이미지 파일 정보 맵 생성
              image_info_map = {}
              for img_key in img_files:
                  try:
                      print(f"이미지 파일 정보 추가: {bucket_name}/{img_key}")
                      
                      # 이미지 메타데이터만 가져오기
                      try:
                          response = s3_client.head_object(Bucket=bucket_name, Key=img_key)
                          content_type = response.get('ContentType', 'image/jpeg')
                      except:
                          content_type = 'image/jpeg'  # 기본값
                      
                      # S3 URI 생성
                      s3_uri = f"s3://{bucket_name}/{img_key}"
                      
                      # 이미지 정보 맵에 추가
                      image_info_map[img_key] = {
                          "s3_uri": s3_uri,
                          "content_type": content_type
                      }
                      
                  except Exception as e:
                      print(f"이미지 파일 정보 추가 실패: {bucket_name}/{img_key}, 오류: {str(e)}")
                      traceback.print_exc()
              
              # 분석 결과의 아티팩트에 이미지 정보 추가
              for analysis in analyses:
                  for artifact in analysis["artifacts"]:
                      file_path = artifact["path"]
                      
                      # S3 URL 형식 처리 (s3://bucket-name/key 형식)
                      if file_path.startswith('s3://'):
                          print(f"S3 URL 형식 감지됨: {file_path}")
                          # s3:// 제거 후 버킷 이름과 키 분리
                          path_parts = file_path[5:].split('/', 1)
                          if len(path_parts) == 2:
                              s3_bucket = path_parts[0]
                              s3_key = path_parts[1]
                              print(f"S3 URL 파싱 결과: 버킷={s3_bucket}, 키={s3_key}")
                          else:
                              s3_bucket = bucket_name
                              s3_key = file_path
                              print(f"S3 URL 파싱 실패, 기본값 사용: 버킷={s3_bucket}, 키={s3_key}")
                      else:
                          # 일반 경로인 경우
                          s3_key = file_path
                      
                      # 이미지 정보 맵에서 찾기
                      for img_key in image_info_map:
                          if img_key.endswith(s3_key) or s3_key.endswith(img_key):
                              print(f"이미지 정보 매칭 성공: {s3_key} -> {img_key}")
                              artifact["s3_uri"] = image_info_map[img_key]["s3_uri"]
                              artifact["content_type"] = image_info_map[img_key]["content_type"]
                              break
              
              print("load_image_files 함수 완료 - 이미지 경로만 추가됨")
              return analyses

          def lambda_handler(event, context):
              """
              Lambda 함수: S3에서 분석 결과 파일과 이미지를 로드하는 함수의 핸들러
              
              Parameters:
              - event: Lambda 이벤트 객체
              - context: Lambda 컨텍스트 객체
              
              Returns:
              - 분석 결과 및 이미지 데이터를 포함하는 JSON 응답
              """
              print("lambda_handler 함수 시작")
              print(f"이벤트: {json.dumps(event)}")
              
              try:
                  action_group = event.get('actionGroup', '')
                  message_version = event.get('messageVersion', '')
                  function = event.get('function', '')
                  
                  print(f"액션 그룹: {action_group}, 메시지 버전: {message_version}, 함수: {function}")
                  
                  if function == 'get_s3_data':
                      # 파라미터 추출
                      s3_uri = get_named_parameter(event, "s3_uri")
                      load_images = get_named_parameter(event, "load_images")
                      
                      print(f"파라미터: s3_uri={s3_uri}, load_images={load_images}")
                      
                      # load_images가 문자열로 전달될 경우 불리언으로 변환
                      if isinstance(load_images, str):
                          load_images = load_images.lower() == 'true'
                          print(f"load_images 문자열을 불리언으로 변환: {load_images}")
                      elif load_images is None:
                          load_images = True
                          print(f"load_images가 None이므로 기본값 사용: {load_images}")
                      
                      # 함수 호출
                      print("get_s3_data 함수 호출")
                      output = get_s3_data(s3_uri, load_images)
                      print(f"get_s3_data 함수 결과: {json.dumps(output, ensure_ascii=False)[:200]}...")
                  else:
                      print(f"지원되지 않는 함수: {function}")
                      output = {
                          'error': f"지원되지 않는 함수: {function}"
                      }
                  
                  # Bedrock Agent 응답 형식으로 변환
                  action_response = {
                      'actionGroup': action_group,
                      'function': function,
                      'functionResponse': {
                          'responseBody': {'TEXT': {'body': json.dumps(output, ensure_ascii=False)}}
                      }
                  }
                  
                  function_response = {'response': action_response, 'messageVersion': message_version}
                  print(f"응답 생성 완료: {json.dumps(function_response, ensure_ascii=False)[:200]}...")
                  return function_response
              
              except Exception as e:
                  print(f"lambda_handler 함수 처리 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  
                  # 오류 발생 시에도 Bedrock Agent 응답 형식으로 반환
                  error_response = {
                      'response': {
                          'actionGroup': event.get('actionGroup', ''),
                          'function': event.get('function', ''),
                          'functionResponse': {
                              'responseBody': {'TEXT': {'body': json.dumps({'error': f"처리 중 오류가 발생했습니다: {str(e)}"}, ensure_ascii=False)}}
                          }
                      },
                      'messageVersion': event.get('messageVersion', '')
                  }
                  return error_response
  
