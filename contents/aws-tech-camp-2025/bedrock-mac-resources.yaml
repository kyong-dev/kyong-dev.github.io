          def download_and_upload_image_to_s3(image_url, bucket_name, prefix, agent_name):
              """
              URL에서 이미지를 다운로드하여 S3에 업로드하는 함수
              
              Parameters:
              - image_url: 이미지 URL
              - bucket_name: S3 버킷 이름
              - prefix: S3 객체 접두사 (폴더 경로)
              - agent_name: 에이전트 이름
              
              Returns:
              - 업로드된 이미지의 S3 경로와 파일 이름
              """
              try:
                  # 이미지 URL에서 파일 이름 추출
                  file_name = image_url.split('/')[-1]
                  
                  # 파일 확장자 확인
                  if '.' not in file_name:
                      file_name = f"{file_name}.jpg"  # 기본 확장자 추가
                  
                  # 고유한 파일 이름 생성
                  unique_id = str(uuid.uuid4())[:8]
                  file_name = f"{agent_name}_{unique_id}_{file_name}"
                  
                  # S3 키 생성
                  s3_key = f"{prefix.rstrip('/')}/images/{file_name}" if prefix else f"images/{file_name}"
                  
                  # 이미지 다운로드
                  response = requests.get(image_url, timeout=10)
                  response.raise_for_status()  # HTTP 오류 발생 시 예외 발생
                  
                  # S3 클라이언트 생성
                  s3_client = boto3.client('s3')
                  
                  # S3에 이미지 업로드
                  s3_client.upload_fileobj(
                      BytesIO(response.content),
                      bucket_name,
                      s3_key,
                      ExtraArgs={'ContentType': response.headers.get('Content-Type', 'image/jpeg')}
                  )
                  
                  return {
                      'file_name': file_name,
                      's3_path': f"s3://{bucket_name}/{s3_key}",
                      'original_url': image_url
                  }
                  
              except Exception as e:
                  print(f"이미지 다운로드 및 업로드 중 오류 발생: {str(e)}")
                  traceback.print_exc()
                  return {
                      'error': f"이미지 처리 중 오류가 발생했습니다: {str(e)}",
                      'original_url': image_url
                  }

          def delete_analysis_file(bucket_name, prefix, file_name):
              """
              S3에 저장된 분석 파일을 삭제하는 함수
              
              Parameters:
              - bucket_name: S3 버킷 이름
              - prefix: S3 객체 접두사 (폴더 경로)
              - file_name: 파일 이름
              
              Returns:
              - 삭제 결과를 포함하는 응답
              """
              try:
                  if not bucket_name:
                      return {'error': '버킷 이름이 제공되지 않았습니다.'}
                  
                  if not file_name:
                      return {'error': '파일 이름이 제공되지 않았습니다.'}
                  
                  # S3 클라이언트 생성
                  s3_client = boto3.client('s3')
                  
                  # S3 키 생성
                  s3_key = f"{prefix.rstrip('/')}/{file_name}" if prefix else file_name
                  
                  # S3에서 파일 삭제
                  s3_client.delete_object(
                      Bucket=bucket_name,
                      Key=s3_key
                  )
                  
                  return {
                      'message': '파일이 성공적으로 삭제되었습니다.',
                      'file_name': file_name,
                      's3_path': f"s3://{bucket_name}/{s3_key}"
